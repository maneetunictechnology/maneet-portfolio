<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131C"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B9CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#70E1C1" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A24"/>
      <stop offset="100%" stop-color="#11151D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#282E3B" stroke-width="1" opacity="0.35">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Window Header -->
  <rect x="80" y="60" width="1040" height="555" rx="16" fill="url(#cardBg)" stroke="#282E3B" stroke-width="2"/>
  <rect x="80" y="60" width="1040" height="52" rx="16" fill="#0D1118"/>
  <circle cx="115" cy="86" r="6" fill="#FF5F56"/>
  <circle cx="135" cy="86" r="6" fill="#FFBD2E"/>
  <circle cx="155" cy="86" r="6" fill="#27C93F"/>
  <text x="200" y="91" fill="#A4ACBC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="1">AI-POWERED CRM ARCHITECTURE // PROSPECT PIPELINE</text>

  <!-- Metric Badges Top -->
  <g transform="translate(110, 135)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="220" height="80" rx="10" fill="#0B0E14" stroke="#282E3B"/>
    <text x="20" y="30" fill="#A4ACBC" font-family="sans-serif" font-size="12" font-weight="600">INBOUND PROSPECTS</text>
    <text x="20" y="62" fill="#F5F7FB" font-family="monospace" font-size="24" font-weight="bold">148</text>
    <circle cx="195" cy="40" r="10" fill="#8B9CFF" fill-opacity="0.15"/>
    
    <!-- Metric 2 -->
    <rect x="250" y="0" width="220" height="80" rx="10" fill="#0B0E14" stroke="#282E3B"/>
    <text x="270" y="30" fill="#A4ACBC" font-family="sans-serif" font-size="12" font-weight="600">QUALIFIED LEADS</text>
    <text x="270" y="62" fill="#70E1C1" font-family="monospace" font-size="24" font-weight="bold">92%</text>

    <!-- Metric 3 -->
    <rect x="500" y="0" width="220" height="80" rx="10" fill="#0B0E14" stroke="#282E3B"/>
    <text x="520" y="30" fill="#A4ACBC" font-family="sans-serif" font-size="12" font-weight="600">DATA ACCURACY</text>
    <text x="520" y="62" fill="#8B9CFF" font-family="monospace" font-size="24" font-weight="bold">98.4%</text>

    <!-- Status Pill -->
    <rect x="750" y="0" width="230" height="80" rx="10" fill="#0B0E14" stroke="#8B9CFF" stroke-opacity="0.4"/>
    <text x="770" y="32" fill="#8B9CFF" font-family="monospace" font-size="11" font-weight="bold">STATUS: PROTOTYPE</text>
    <text x="770" y="58" fill="#F5F7FB" font-family="sans-serif" font-size="13" font-weight="500">Pipeline &amp; Scoring Logic</text>
  </g>

  <!-- Pipeline Stages Columns -->
  <g transform="translate(110, 240)">
    <!-- Column 1: Ingestion -->
    <rect x="0" y="0" width="225" height="340" rx="12" fill="#0D1117" stroke="#282E3B"/>
    <text x="20" y="32" fill="#F5F7FB" font-family="sans-serif" font-size="13" font-weight="bold">1. Discovery Stage</text>
    <rect x="15" y="50" width="195" height="75" rx="8" fill="#151A24" stroke="#282E3B"/>
    <text x="25" y="75" fill="#8B9CFF" font-family="sans-serif" font-size="12" font-weight="bold">Acme Cloud Systems</text>
    <text x="25" y="95" fill="#A4ACBC" font-family="sans-serif" font-size="11">Domain analysis logged</text>
    <rect x="15" y="135" width="195" height="75" rx="8" fill="#151A24" stroke="#282E3B"/>
    <text x="25" y="160" fill="#8B9CFF" font-family="sans-serif" font-size="12" font-weight="bold">Nova Retail Solutions</text>
    <text x="25" y="180" fill="#A4ACBC" font-family="sans-serif" font-size="11">Tech stack scanned</text>

    <!-- Column 2: Qualification -->
    <rect x="250" y="0" width="225" height="340" rx="12" fill="#0D1117" stroke="#282E3B"/>
    <text x="270" y="32" fill="#F5F7FB" font-family="sans-serif" font-size="13" font-weight="bold">2. Scoring &amp; Fit</text>
    <rect x="265" y="50" width="195" height="75" rx="8" fill="#151A24" stroke="#282E3B"/>
    <text x="275" y="75" fill="#70E1C1" font-family="sans-serif" font-size="12" font-weight="bold">Score: 94 / 100</text>
    <text x="275" y="95" fill="#A4ACBC" font-family="sans-serif" font-size="11">Enterprise alignment</text>
    <rect x="265" y="135" width="195" height="75" rx="8" fill="#151A24" stroke="#282E3B"/>
    <text x="275" y="160" fill="#70E1C1" font-family="sans-serif" font-size="12" font-weight="bold">Score: 88 / 100</text>
    <text x="275" y="180" fill="#A4ACBC" font-family="sans-serif" font-size="11">Mid-market target</text>

    <!-- Column 3: Recommendations -->
    <rect x="500" y="0" width="225" height="340" rx="12" fill="#0D1117" stroke="#282E3B"/>
    <text x="520" y="32" fill="#F5F7FB" font-family="sans-serif" font-size="13" font-weight="bold">3. Next Action</text>
    <rect x="515" y="50" width="195" height="75" rx="8" fill="#151A24" stroke="#282E3B"/>
    <text x="525" y="75" fill="#F5F7FB" font-family="sans-serif" font-size="12" font-weight="bold">Executive Briefing</text>
    <text x="525" y="95" fill="#A4ACBC" font-family="sans-serif" font-size="11">Outreach template #A</text>

    <!-- Column 4: Architecture Schema Details -->
    <rect x="750" y="0" width="230" height="340" rx="12" fill="#080B10" stroke="#282E3B"/>
    <text x="765" y="32" fill="#8B9CFF" font-family="monospace" font-size="12" font-weight="bold">schema.json</text>
    <text x="765" y="65" fill="#A4ACBC" font-family="monospace" font-size="10">{</text>
    <text x="775" y="85" fill="#70E1C1" font-family="monospace" font-size="10">"leadId": "crm_091",</text>
    <text x="775" y="105" fill="#A4ACBC" font-family="monospace" font-size="10">"stage": "qualified",</text>
    <text x="775" y="125" fill="#A4ACBC" font-family="monospace" font-size="10">"score": 94,</text>
    <text x="775" y="145" fill="#8B9CFF" font-family="monospace" font-size="10">"fitCriteria": {</text>
    <text x="785" y="165" fill="#A4ACBC" font-family="monospace" font-size="10">"budget": true,</text>
    <text x="785" y="185" fill="#A4ACBC" font-family="monospace" font-size="10">"timeline": "Q4"</text>
    <text x="775" y="205" fill="#8B9CFF" font-family="monospace" font-size="10">}</text>
    <text x="765" y="225" fill="#A4ACBC" font-family="monospace" font-size="10">}</text>
  </g>
</svg>
